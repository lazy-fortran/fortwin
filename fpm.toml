name = "fortwin"
version = "0.1.0"
license = "MIT"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
copyright = "Copyright 2026, Christopher Albert"
description = "Windows, keyboard, pointer and clipboard on X11 in Fortran"

[build]
auto-executables = false
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

# plain fpm ignores this; fo leaves the test needing an X server out of its
# fast default selection, and .github/ci/check runs it with --all.
[extra.fo.test-groups]
slow = { tests = ["test_fortwin"] }

[preprocess]
cpp.suffixes = ["f90"]

[features]
platform.macos.preprocess.cpp.macros = ["__APPLE__"]
platform.windows.preprocess.cpp.macros = ["_WIN32"]

[profiles]
default = ["platform"]
